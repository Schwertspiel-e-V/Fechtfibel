name: Build Fechtfibel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-german \
            latexmk

      - name: Build PDF
        working-directory: Source
        run: |
          mkdir -p ../Output
          latexmk -pdf -interaction=nonstopmode -halt-on-error \
            -outdir=../Output Fechtfibel.tex

      - name: Prepare Pages
        run: |
          mkdir public
          cp Output/Fechtfibel.pdf public/Fechtfibel.pdf
          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=Fechtfibel.pdf">
              <title>Fechtfibel</title>
            </head>
            <body>
              <p><a href="Fechtfibel.pdf">Fechtfibel öffnen</a></p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
