name: Build Fechtfibel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-german \
            latexmk

      - name: Build PDFs
        run: python build.py

      - name: Prepare Pages
        run: |
          mkdir -p public
          cp Output/Fechtfibel-screen.pdf public/Fechtfibel-screen.pdf
          cp Output/Fechtfibel-paper.pdf public/Fechtfibel-paper.pdf
          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
            <head>
              <title>Fechtfibel</title>
            </head>
            <body>
              <h1>Fechtfibel</h1>
              <p><a href="Fechtfibel-screen.pdf">Screen version</a></p>
              <p><a href="Fechtfibel-paper.pdf">Paper version</a></p>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
